<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — SuperMart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0d1117;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Animated background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(34,197,94,0.12), transparent 70%);
      top: -150px; left: -150px;
      animation: float1 8s ease-in-out infinite;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(96,165,250,0.08), transparent 70%);
      bottom: -100px; right: -100px;
      animation: float2 10s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); }
      50%       { transform: translate(40px, 30px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); }
      50%       { transform: translate(-30px, -20px); }
    }

    .login-card {
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      position: relative;
      z-index: 1;
      animation: slideUp 0.5s cubic-bezier(0.4,0,0.2,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Top shimmer line */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 20%; right: 20%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #4ade80, transparent);
      border-radius: 999px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      font-size: 48px;
      display: block;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 16px rgba(74,222,128,0.4));
    }

    .logo h1 {
      color: #e6edf3;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo p {
      color: #8b949e;
      font-size: 13px;
      margin-top: 4px;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .alert-error  { background: rgba(220,38,38,0.12); border: 1px solid rgba(220,38,38,0.3); color: #f87171; }
    .alert-success{ background: rgba(34,197,94,0.10); border: 1px solid rgba(34,197,94,0.3);  color: #4ade80; }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #8b949e;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #e6edf3;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    input::placeholder { color: #484f58; }
    input:focus {
      border-color: rgba(74,222,128,0.5);
      background: rgba(74,222,128,0.06);
      box-shadow: 0 0 0 3px rgba(74,222,128,0.12);
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      color: #8b949e;
      font-size: 13px;
      cursor: pointer;
    }
    .remember input { width: auto; }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(34,197,94,0.35);
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(34,197,94,0.45);
    }
    .btn-login:active { transform: translateY(0); }

    .hint {
      margin-top: 24px;
      padding: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      font-size: 12px;
      color: #484f58;
      text-align: center;
      line-height: 1.7;
    }
    .hint strong { color: #8b949e; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <span class="logo-icon">🛒</span>
      <h1>SuperMart</h1>
      <p>Supermarket Management System</p>
    </div>

    <!-- Error message -->
    <div th:if="${errorMsg}" class="alert alert-error">
      🔒 <span th:text="${errorMsg}"></span>
    </div>
    <!-- Logout message -->
    <div th:if="${logoutMsg}" class="alert alert-success">
      ✓ <span th:text="${logoutMsg}"></span>
    </div>

    <form method="post" action="/login">
      <!-- Spring Security CSRF token -->
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="field">
        <label for="username">Login ID</label>
        <input type="text" id="username" name="username"
               placeholder="Enter your login ID" autocomplete="username" autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Enter your password" autocomplete="current-password">
      </div>

      <label class="remember">
        <input type="checkbox" name="remember-me"> Remember me for 7 days
      </label>

      <button type="submit" class="btn-login">🔐 Sign In to SuperMart</button>
    </form>

    <div class="hint">
      <strong>Default credentials</strong><br>
      Admin: <strong>Harshad</strong> / <strong>12345678</strong><br>
      Cashier: <strong>cashier</strong> / <strong>cashier123</strong>
    </div>
  </div>
</body>
</html>
