<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SuperMart Products — add, edit and manage your product catalogue.">
  <title>Products — SuperMart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="container">
  <div id="msg" class="msg"></div>

  <!-- ── Add / Edit Form ── -->
  <div class="card">
    <h2 id="formTitle">Add Product</h2>
    <input type="hidden" id="pid">
    <div class="form-row">
      <input id="name"     placeholder="Product name *" title="Required">
      <input id="category" placeholder="Category (e.g. Dairy)" list="cat-list">
      <datalist id="cat-list"></datalist>
    </div>
    <div class="form-row">
      <input id="price"  type="number" step="0.01" min="0"  placeholder="Price ₹ *">
      <input id="gst"    type="number" step="0.01" min="0"  placeholder="GST %">
      <input id="stock"  type="number" min="0"               placeholder="Stock qty">
      <input id="expiry" type="date"   title="Expiry date (optional)">
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button onclick="saveProduct()" id="saveBtn">💾 Save Product</button>
      <button class="gray" onclick="resetForm()">✕ Clear</button>
      <span style="color:var(--text-muted);font-size:13px">Tip: Press <kbd>Escape</kbd> to clear form</span>
    </div>
  </div>

  <!-- ── Product List ── -->
  <div class="card">
    <div class="form-row" style="align-items:center">
      <h2 style="margin:0;flex:2">All Products</h2>
      <input  id="search"   placeholder="🔍 Search..." oninput="loadProducts()" style="min-width:180px">
      <select id="catFilter" onchange="loadProducts()" style="min-width:150px">
        <option value="">All Categories</option>
      </select>
      <button class="gray small" onclick="loadProducts()" title="Refresh">↻ Refresh</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Category</th>
          <th class="num">Price</th><th class="num">GST%</th>
          <th class="num">Stock</th><th>Expiry</th><th class="num">Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="product-count" style="margin-top:10px;color:var(--text-muted);font-size:13px"></div>
  </div>
</div>



<!-- Restock Modal -->
<div id="restock-modal" class="restock-modal-overlay" style="display:none">
  <div class="restock-modal-box">
    <h3>📦 Restock Product</h3>
    <p id="restock-name" style="color:var(--text-secondary);margin:8px 0 16px"></p>
    <input id="restock-qty" type="number" min="1" placeholder="Quantity to add" style="margin-bottom:14px">
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="gray" onclick="closeRestock()">Cancel</button>
      <button onclick="doRestock()">✓ Add Stock</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
  renderNav('📦 Products');
  let list = [];
  let restockId = null;

  // Load categories into datalist + filter dropdown
  async function loadCategories() {
    const cats = await api('/products/categories');
    const dl = document.getElementById('cat-list');
    const cf = document.getElementById('catFilter');
    dl.innerHTML = cats.map(c => `<option value="${c}">`).join('');
    // keep existing options beyond "All Categories"
    const existing = [...cf.options].map(o => o.value).slice(1);
    cats.forEach(c => {
      if (!existing.includes(c)) {
        const o = document.createElement('option');
        o.value = c; o.textContent = c;
        cf.appendChild(o);
      }
    });
  }

  async function loadProducts() {
    const q   = document.getElementById('search').value;
    const cat = document.getElementById('catFilter').value;
    const params = new URLSearchParams();
    if (q)   params.set('search', q);
    if (cat) params.set('category', cat);
    list = await api('/products?' + params.toString());
    const today = new Date().toISOString().slice(0,10);
    document.getElementById('rows').innerHTML = list.map(p => {
      const expBadge = expiryBadge(p.expiryDate);
      const lowCls   = p.stock < 10 ? 'low' : '';
      return `<tr>
        <td><span class="id-badge">#${p.id}</span></td>
        <td><strong>${p.name}</strong></td>
        <td>${p.category ? `<span class="badge badge-cat">${p.category}</span>` : '<span style="color:var(--text-muted)">—</span>'}</td>
        <td class="num">${money(p.price)}</td>
        <td class="num">${p.gstPercent}%</td>
        <td class="num ${lowCls}">${p.stock}${p.stock < 10 ? ' ⚠' : ''}</td>
        <td>${expBadge || '<span style="color:var(--text-muted)">—</span>'}</td>
        <td class="num" style="white-space:nowrap">
          <button class="small" onclick="editProduct(${p.id})">✏ Edit</button>
          <button class="small" style="background:linear-gradient(135deg,#2563eb,#60a5fa)" onclick="openRestock(${p.id},'${p.name.replace(/'/g,'&apos;')}')">+ Stock</button>
          <button class="small danger" onclick="confirm2('Delete &quot;${p.name}&quot;? This cannot be undone.',()=>deleteProduct(${p.id}))">🗑</button>
        </td>
      </tr>`;
    }).join('') || '<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--text-muted)">No products found</td></tr>';
    document.getElementById('product-count').textContent = `Showing ${list.length} product${list.length !== 1 ? 's' : ''}`;
  }

  async function saveProduct() {
    const id = document.getElementById('pid').value;
    const body = {
      name:        document.getElementById('name').value,
      category:    document.getElementById('category').value,
      price:       document.getElementById('price').value,
      gstPercent:  document.getElementById('gst').value || 0,
      stock:       document.getElementById('stock').value || 0,
      expiryDate:  document.getElementById('expiry').value || null,
    };
    try {
      await api(id ? '/products/' + id : '/products', { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
      showMsg(id ? '✓ Product updated' : '✓ Product added');
      resetForm(); loadProducts(); loadCategories();
    } catch (e) { showMsg(e.message, false); }
  }

  function editProduct(id) {
    const p = list.find(x => x.id === id);
    document.getElementById('pid').value      = p.id;
    document.getElementById('name').value     = p.name;
    document.getElementById('category').value = p.category || '';
    document.getElementById('price').value    = p.price;
    document.getElementById('gst').value      = p.gstPercent;
    document.getElementById('stock').value    = p.stock;
    document.getElementById('expiry').value   = p.expiryDate || '';
    document.getElementById('formTitle').textContent = `Edit Product #${id}`;
    document.getElementById('saveBtn').textContent   = '💾 Update Product';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function deleteProduct(id) {
    await api('/products/' + id, { method: 'DELETE' });
    showMsg('Product deleted'); loadProducts();
  }

  function resetForm() {
    ['pid','name','category','price','gst','stock','expiry'].forEach(i => document.getElementById(i).value = '');
    document.getElementById('formTitle').textContent    = 'Add Product';
    document.getElementById('saveBtn').textContent      = '💾 Save Product';
  }

  // Restock
  function openRestock(id, name) {
    restockId = id;
    document.getElementById('restock-name').textContent = name;
    document.getElementById('restock-qty').value = '';
    document.getElementById('restock-modal').style.display = 'flex';
    setTimeout(() => document.getElementById('restock-qty').focus(), 50);
  }
  function closeRestock() {
    document.getElementById('restock-modal').style.display = 'none';
    restockId = null;
  }
  async function doRestock() {
    const qty = parseInt(document.getElementById('restock-qty').value);
    if (!qty || qty <= 0) { toast('Enter a valid quantity', 'err'); return; }
    try {
      await api('/products/' + restockId + '/restock', { method: 'PATCH', body: JSON.stringify({ qty }) });
      showMsg(`✓ Added ${qty} units to stock`);
      closeRestock(); loadProducts();
    } catch (e) { showMsg(e.message, false); }
  }

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { resetForm(); closeRestock(); }
    if (e.key === 'Enter' && e.target.id === 'restock-qty') doRestock();
  });


  loadProducts();
  loadCategories();
</script>
</body>
